<html>
    <head>
        <title>grid</title>
        <style>
            body{
                height: auto;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 2%;

            }
            .box{
                background-color: rgb(95, 63, 124);
            }
        .container1{
            display:grid;
            grid-auto-columns:200px;
            grid-auto-rows: 200px;
            /* grid-template-columns: 200px 200px 200px;
            grid-template-rows: 200px 200px 200px;  */
            gap:1em;
            grid-template-areas: 
            /* "box-1 box-2 box-2"
            "box-3 box-3 box-3" */
             "box-1 box-2 box-2 box-3"
            "box-1 box-4 box-5 box-5"; 
             

        }
        
        </style>
    </head>
    <body>
        <div class="container1">
            <div class="box" style="grid-area: box-1">
                <p>ABCD</p>
            </div>
             <div class="box" style="grid-area: box-2"><P>gfgh</P></div>
              <div class="box" style="grid-area: box-3"></div>
               <div class="box" style="grid-area: box-4"></div>
                <div class="box" style="grid-area: box-5"></div>
            
        </div>
    </body>
</html>
