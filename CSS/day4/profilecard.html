<html>
    <html lang="en">
        <head>
            <meta charset="UTF-8"/>
            <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
            <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
            <title>profile card ui design</title>

            <link rel="stylesheet" href="style.css"/>

            <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'/>
        </head>
        <body>
            <div class="profile-card">
                <div class="image">
                    <img src="profile.jpg" alt="image" class="profile-image">
                </div>
                <div class="text-data">
                    <span class="name">codinglab</span>
                    <span class="job">youtube& blogger</span>
                </div>
                <div class="media-buttons">
                    <a href="#" style="background: rgb(81, 0, 255)" class="link"></a>
                 
                    <i class="bx bx1-facebook"></i>

                 </a> 
                 <a href="#" style="background: blue" class="link">
                    <i class='bx bx1-twitter'></i>

                 </a> 
                 <a href="#" style="background: rgb(171, 10, 32) " class="link">
                    <i class='bx bx1-instagram'></i>

                 </a> 
                 <a href="#" style="background: rgb(215, 8, 8)" class="link">
                    <i class='bx bx1-youtube'></i>

                 </a> 
                 
                </div>
                <div class="buttons">
                    <button class="button">subscribe</button>
                    <button class="button">massage</button>
                </div>
                <div class="analytics">
                    <div class="data">
                        <i class='bx bx-heart'></i>
                        <span class="number">60k</span>
                    </div>
                     <div class="data">
                        <i class='bx bx-message-rounded'></i>
                        <span class="number">60k</span>
                    </div>
                     <div class="data">
                        <i class='bx bx-share'></i>
                        <span class="number">60k</span>
                    </div>
                </div>
            </div>
        </body>
    </html>
</html>
