<html>
    <head>
        <title>responsive</title>
        <style>
            body{
                background-color: brown;

            }
            @media(max-width:600px){
                body{
                    background-color:rgb(128, 158, 159);


            }
            h1{
                color: rgb(red, green, blue);
            }
        }
            @media(max-width:300px){
                body{
                    background-color: rgb(111, 158, 123);

                }
                h1{
                    color:white
                }
            }
        </style>
    </head>
    <body>
        <h1>hello world</h1>
    </body>
</html>
