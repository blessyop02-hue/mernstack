<html>
    <body>
    <form action="submit.html" method="post">
        <label for="name">Full name</label>
        <input type="text" id="fullname" name="fullname" required><br><br>
        <label for="email">Email id</label>
        <input type="email" id="email" name="email" required><br><br>
        <label for="phone">phone</label>
        <input type="number" id="number" name="phone" required><br><br>
        <label for="dob">DOB</label>
        <input type="date" id="DOB" name="DOB" required><br><br>
        <label for="gender">Gender:</label>
        
        <input type="radio" id="Male" name="Male" value="Male" >
        <label for="Male">Male</label>
        
        <input type="radio" id="feMale" name="feMale" value="FeMale" >
        <label for="Male">FeMale</label>
        
        <input type="radio" id="other" name="other" value="other">
        <label for="Male">other</label><br>

        <label for="course">course</label>
        <select name="course" id="course">
            <option value="">select course</option>
            <option value="BCA">BCA</option>
            <option value="BBA">BBA</option>
            <option value="MBA">MBA</option>
        </selection>

         <label for="Skill">Skill</label>
        
        <input type="checkbox" id="html" name="skill" value="HTML">
        <label for="html">HTML</label><br>
        
        <input type="checkbox" id="JavaScript" name="JavaScript" value="JavaScript">
        <label for="JavaScript">JavaScript</label><br><br>
        <label for="photo">profile photo</label>
        <input type="file" id="photo" name="photo"><br><br>
        <label for="address">address</label>
        <input type="textarea" id="address" name="address" rows="5" cols="40"></textarea><br><br>
        <input type="submit" value="register">


    </form>
    </body>
</html>
